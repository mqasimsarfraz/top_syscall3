name: "top_syscall3"
description: Periodically report chdir syscall counts by process
homepageURL: https://github.com/mqasimsarfraz/top_syscall3
documentationURL: https://github.com/mqasimsarfraz/top_syscall3#readme
sourceURL: https://github.com/mqasimsarfraz/top_syscall3
datasources:
  calls:
    fields:
      process_id:
        annotations:
          columns.hidden: "true"
      calls:
        annotations:
          description: Chdir attempts in this fetch interval
          columns.width: "12"
          columns.alignment: right
